name: P11 Apple Live Smoke C8D8EA73 V2
on:
  push:
    branches:
      - ci/p11-live-c8d8ea73-v2
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c8d8ea73840e3231625ad304c6d0032637b0b666
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install runtime
        run: python -m pip install pymupdf==1.28.2
      - name: Apple FY2025 first ingest
        shell: pwsh
        env:
          PYTHONPATH: src
          FFDF_SEC_CONTACT_EMAIL: ${{ secrets.FFDF_SEC_CONTACT_EMAIL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FFDF_SEC_CONTACT_EMAIL)) { throw "SEC contact secret missing" }
          $env:FFDF_ROOT = Join-Path $env:RUNNER_TEMP "ffdf-p11-live-c8d8ea73"
          python -m financial_filing_data_foundation.user_cli ingest --market US --cik 320193 --ticker AAPL --year 2025 --period FY | Tee-Object -FilePath first-ingest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r = Get-Content first-ingest.json -Raw | ConvertFrom-Json
          if ($r.accession -ne "0000320193-25-000079") { throw "unexpected accession" }
          if ($r.validation_status -ne "PASS" -or [int]$r.blocking_issue_count -ne 0 -or $r.research_ready -ne $true) { throw "first ingest not research ready" }
          $m = Get-Content (Join-Path $r.artifact_dir "manifest.json") -Raw | ConvertFrom-Json
          if ($m.schema_version -ne "p11-sec-artifacts-v3" -or $m.parser_version -ne "VIRTUAL_HTML_V6") { throw "wrong parser/artifact version" }
          if ($m.fact_source_mode -ne "INLINE_XBRL_PRIMARY" -or [int]$m.fact_count -le 0) { throw "wrong fact source" }
          Write-Host "FIRST_FACT_COUNT=$($m.fact_count)"
          Write-Host "FIRST_PACKAGE_SHA=$($r.package_sha256)"
      - name: Apple FY2025 second ingest and local status
        shell: pwsh
        env:
          PYTHONPATH: src
          FFDF_SEC_CONTACT_EMAIL: ${{ secrets.FFDF_SEC_CONTACT_EMAIL }}
        run: |
          $env:FFDF_ROOT = Join-Path $env:RUNNER_TEMP "ffdf-p11-live-c8d8ea73"
          python -m financial_filing_data_foundation.user_cli ingest --market US --cik 320193 --ticker AAPL --year 2025 --period FY | Tee-Object -FilePath second-ingest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r = Get-Content second-ingest.json -Raw | ConvertFrom-Json
          if ($r.planner_action -ne "REUSE_DATA" -or $r.validation_status -ne "PASS" -or $r.research_ready -ne $true) { throw "second ingest did not reuse current data" }
          Write-Host "SECOND_PLANNER_ACTION=$($r.planner_action)"
          python -m financial_filing_data_foundation.user_cli status --market US --cik 320193 --year 2025 --period FY | Tee-Object -FilePath status.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $s = Get-Content status.json -Raw | ConvertFrom-Json
          if ($s.p8_catalog_registered -ne $true -or $null -eq $s.discovery_as_of) { throw "local status missing catalog/discovery" }
