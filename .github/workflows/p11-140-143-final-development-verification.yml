name: P11 140-143 Final Development Verification

on:
  push:
    branches:
      - ci/p11-140-143-52992c35

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact work candidate
        uses: actions/checkout@v4
        with:
          ref: 52992c35d178c17f24ae4b261d729bf9e6f62284
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pymupdf==1.28.2 mcp==2.3.0 mcp-types==2.3.0

      - name: Static compile
        env:
          PYTHONPATH: src
        run: python -m compileall -q src

      - name: Focused US SEC suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/unit/us_sec

      - name: US SEC plus MCP catalog regression
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/unit/us_sec tests/unit/mcp/test_catalog_service.py

      - name: Full unit regression
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/unit

      - name: Diff whitespace check
        run: git diff --check b1082f8a2110ddaaa238ca2a627903fb5b2ef283 52992c35d178c17f24ae4b261d729bf9e6f62284
