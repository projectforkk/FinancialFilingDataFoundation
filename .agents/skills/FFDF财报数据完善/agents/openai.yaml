interface:
  display_name: "FFDF财报数据完善"
  short_description: "按公司、年度区间和 Luna 5.6 Max 执行 FFDF Research Preflight"
  default_prompt: "使用 $FFDF财报数据完善，三个必填参数依次为公司、年度区间、模型。例如：$FFDF财报数据完善 605117 2021-2026 luna5.6-max。默认对 COMPLETE_BASE / COMPLETE_REVIEWED 财报标记 SKIPPED_ALREADY_COMPLETE，不重复 Luna、PDF 或 P9；只有显式追加 重新完善 才重新检查，例如：$FFDF财报数据完善 605117 2021-2026 luna5.6-max 重新完善。其余疑难项按 Research Preflight、P9 / upstream-fix 边界处理。"

policy:
  allow_implicit_invocation: false
